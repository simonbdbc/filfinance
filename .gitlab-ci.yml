rust:fmt:
  stage: validate
  image: rust:1.96.0-bookworm
  script:
    - cd filfinance-service
    - cargo fmt --check

rust:test:
  stage: validate
  image: rust:1.96.0-bookworm
  script:
    - cd filfinance-service
    - cargo test

calendar:native:recovery:
  stage: validate
  image: rust:1.96.0-bookworm
  script:
    - cd filfinance-service
    - cargo test native_calendar_recovery_e2e_is_idempotent_and_keeps_live_news_unblocked -- --nocapture

edge:check:
  stage: validate
  image: node:24.13.1
  cache:
    key:
      files:
        - filfinance-edge/package-lock.json
    paths:
      - .npm
  script:
    - cd filfinance-edge
    - npm ci
    - npm run check

auth:check:
  stage: validate
  image: node:24.13.1
  cache:
    key:
      files:
        - filfinance-auth/package-lock.json
    paths:
      - .npm
  script:
    - cd filfinance-auth
    - npm ci
    - npm test
    - npm run check

auth:integration:
  stage: validate
  image: node:24.13.1
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: filfinance
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: filfinance_ci
    AUTH_DATABASE_URL: postgresql://postgres:filfinance_ci@postgres:5432/filfinance
    DATABASE_URL: postgresql://postgres:filfinance_ci@postgres:5432/filfinance
    BETTER_AUTH_URL: http://localhost:3000
    BETTER_AUTH_SECRET: filfinance-ci-secret-with-at-least-thirty-two-characters
    BETTER_AUTH_JWT_AUDIENCE: http://localhost:3000
    BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:8052
    BETTER_AUTH_REQUIRE_EMAIL_VERIFICATION: "true"
    APP_WEB_URL: http://localhost:8052
    SMTP_HOST: 127.0.0.1
    SMTP_PORT: "2525"
    SMTP_SECURE: "false"
    SMTP_REQUIRE_TLS: "false"
    SMTP_FROM_EMAIL: noreply@filfinance.test
    SMTP_FROM_NAME: Fil Finance CI
  cache:
    key:
      files:
        - filfinance-auth/package-lock.json
    paths:
      - .npm
  script:
    - cd filfinance-auth
    - export PORT=3000
    - npm ci
    - |
      node -e "const { Client } = require('pg'); const sleep = ms => new Promise(r => setTimeout(r, ms)); (async () => { for (let i = 0; i < 30; i += 1) { const db = new Client({ connectionString: process.env.AUTH_DATABASE_URL }); try { await db.connect(); await db.query('CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE SCHEMA IF NOT EXISTS auth; CREATE SCHEMA IF NOT EXISTS app;'); await db.end(); return; } catch (error) { await db.end().catch(() => {}); if (i === 29) throw error; await sleep(1000); } } })()"
    - bash scripts/run_integration_smoke.sh

landing:check:
  stage: validate
  image: node:24.13.1-bookworm
  cache:
    key:
      files:
        - apps/landing/package-lock.json
    paths:
      - .npm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends chromium
  script:
    - cd apps/landing
    - npm ci
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "dev" ]; then
        : "${FILFINANCE_DEV_PWA_URL:?Missing FILFINANCE_DEV_PWA_URL for the dev landing build}"
        printf '%s' "$FILFINANCE_DEV_PWA_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?$' || {
          echo "FILFINANCE_DEV_PWA_URL must be an HTTPS origin without a path" >&2
          exit 1
        }
        printf '%s' "$FILFINANCE_DEV_PWA_URL" | grep -Eiq 'replace-with|(^|\.)example\.|\.invalid$' && {
          echo "FILFINANCE_DEV_PWA_URL contains a placeholder host" >&2
          exit 1
        } || true
        printf '%s' "$FILFINANCE_DEV_PWA_URL" | grep -Eq '^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.filfinance\.fr$' || {
          echo "FILFINANCE_DEV_PWA_URL must use a same-site *.filfinance.fr custom domain" >&2
          exit 1
        }
        export FILFINANCE_LANDING_URL="https://dev.filfinance.fr"
        export FILFINANCE_PWA_URL="$FILFINANCE_DEV_PWA_URL"
      else
        export FILFINANCE_LANDING_URL="https://filfinance.fr"
        export FILFINANCE_PWA_URL="https://app.filfinance.fr"
      fi
    - PUBLIC_LEGAL_PUBLICATION_ENFORCED=true npm run check
    - CHROME_PATH=/usr/bin/chromium npm run lighthouse:ci
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - apps/landing/dist
      - apps/landing/reports

client:typecheck:
  stage: validate
  image: node:24.13.1
  cache:
    key:
      files:
        - apps/pwa/package-lock.json
    paths:
      - .npm
  script:
    - cd apps/pwa
    - npm ci
    - npm run qa:frontend

client:web-build:
  stage: validate
  image: node:24.13.1
  cache:
    key:
      files:
        - apps/pwa/package-lock.json
    paths:
      - .npm
  script:
    - cd apps/pwa
    - npm ci
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "main" ] && [ "${FILFINANCE_PROD_DEPLOY_ENABLED:-false}" = "true" ]; then
        test "${FILFINANCE_PROD_HLS_BASE_URL:-}" = "https://media.filfinance.fr" || {
          echo "FILFINANCE_PROD_HLS_BASE_URL must equal https://media.filfinance.fr" >&2
          exit 1
        }
        export EXPO_PUBLIC_FILFINANCE_WS_URL="wss://api.filfinance.fr/ws/news"
        export EXPO_PUBLIC_FILFINANCE_EDGE_WS_URL="wss://live.filfinance.fr/ws/live"
        export EXPO_PUBLIC_FILFINANCE_HLS_BASE_URL="$FILFINANCE_PROD_HLS_BASE_URL"
        export EXPO_PUBLIC_FILFINANCE_PWA_URL="https://app.filfinance.fr"
        export EXPO_PUBLIC_API_URL="https://api.filfinance.fr"
        export EXPO_PUBLIC_BETTER_AUTH_URL="https://api.filfinance.fr"
      fi
      if [ "${CI_COMMIT_BRANCH:-}" = "dev" ]; then
        test -n "${FILFINANCE_DEV_PWA_URL:-}" || {
          echo "FILFINANCE_DEV_PWA_URL is required for the dev PWA build" >&2
          exit 1
        }
        test "${FILFINANCE_DEV_HLS_BASE_URL:-}" = "https://media.dev.filfinance.fr" || {
          echo "FILFINANCE_DEV_HLS_BASE_URL must equal https://media.dev.filfinance.fr" >&2
          exit 1
        }
        export EXPO_PUBLIC_FILFINANCE_WS_URL="wss://api.dev.filfinance.fr/ws/news"
        export EXPO_PUBLIC_FILFINANCE_EDGE_WS_URL="wss://live.dev.filfinance.fr/ws/live"
        export EXPO_PUBLIC_FILFINANCE_HLS_BASE_URL="$FILFINANCE_DEV_HLS_BASE_URL"
        export EXPO_PUBLIC_FILFINANCE_PWA_URL="$FILFINANCE_DEV_PWA_URL"
        export EXPO_PUBLIC_API_URL="https://api.dev.filfinance.fr"
        export EXPO_PUBLIC_BETTER_AUTH_URL="https://api.dev.filfinance.fr"
      fi
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "dev" ]; then
        export EXPO_PUBLIC_LANDING_ORIGIN="https://dev.filfinance.fr"
      else
        export EXPO_PUBLIC_LANDING_ORIGIN="https://filfinance.fr"
      fi
    - npm run build:web
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "main" ] && [ "${FILFINANCE_PROD_DEPLOY_ENABLED:-false}" = "true" ]; then
        node scripts/check-web-public-env.cjs --target prod --dist dist
      fi
      if [ "${CI_COMMIT_BRANCH:-}" = "dev" ]; then
        node scripts/check-web-public-env.cjs --target dev --dist dist
      fi
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - apps/pwa/dist

release:prod-lock:
  stage: validate
  image: alpine:3.22
  before_script:
    - apk add --no-cache bash curl jq
  script:
    # Le test de récupération Rust est exécuté par `calendar:native:recovery`
    # dans cette même pipeline. La release PROD ne dépend ni de DEV, ni d'un
    # smoke DEV, ni d'une parité n8n désormais retirée.
    - bash scripts/check_gitlab_release_gate.sh production lock-only
    - bash scripts/check_bunny_prod_release_preflight.sh
  rules:
    # Une promotion de source sur `main` ne constitue pas une demande de
    # release. Cette preflight ne s'exécute que pour une pipeline protegee
    # explicitement lancee depuis GitLab (web/API), avec l'intention de release
    # declaree. Les jobs mutables ci-dessous reprennent exactement ce garde-fou.
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $FILFINANCE_PROD_RELEASE_REQUESTED == "true" && $FILFINANCE_PROD_DEPLOY_ENABLED == "true" && $FILFINANCE_PROD_BUNNY_DEPLOY_ENABLED == "true" && $FILFINANCE_BETTER_AUTH_DEPLOY_ENABLED == "true"'
  environment:
    name: production/preflight
    action: verify

release:dev-lock:
  stage: validate
  image: alpine:3.22
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash scripts/check_gitlab_release_gate.sh development lock-only
    - bash scripts/check_bunny_dev_release_preflight.sh
  rules:
