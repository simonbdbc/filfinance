      # Le Worker live reste soumis a la meme approbation explicite que le backend.
      when: manual
      allow_failure: false

.deploy_backend_template: &deploy_backend_template
  stage: deploy
  image: alpine:3.22
  interruptible: false
  dependencies: []
  environment:
    name: production
  before_script:
    - apk add --no-cache curl openssh-client
    - export SSH_PORT="${SSH_PORT:-${PORT:-}}"
    - 'test -n "$SSH_PORT" || { echo "Missing SSH_PORT" >&2; exit 1; }'
    - ': "${CI_COMMIT_SHA:?Missing CI_COMMIT_SHA}"'
    - ': "${SSH_HOST_KEY_SHA256:?Missing SSH_HOST_KEY_SHA256}"'
    - 'case "$SSH_HOST_KEY_SHA256" in SHA256:*) ;; *) echo "SSH_HOST_KEY_SHA256 must use the SHA256: fingerprint format" >&2; exit 1 ;; esac'
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa_home_srv_gitlab_ci
    - chmod 700 ~/.ssh/id_rsa_home_srv_gitlab_ci
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa_home_srv_gitlab_ci
    - |
      # ssh-keyscan essaie aussi des algorithmes optionnels. Certains peuvent
      # etre refuses par le serveur alors que des cles hote valides ont ete
      # recues ; seule l'absence de cle candidate doit bloquer le deploiement.
      ssh-keyscan -p "$SSH_PORT" "$HOST" 2>/dev/null > ~/.ssh/known_hosts.candidate || true
      test -s ~/.ssh/known_hosts.candidate || {
        echo "Unable to read the SSH host key candidate" >&2
        exit 1
      }
      : > ~/.ssh/known_hosts
      while IFS= read -r candidate; do
        # OpenSSH peut ecrire ses bannieres en commentaires sur stdout.
        # Seules les lignes de cle passent au calcul d'empreinte ; une cle
        # invalide ou une empreinte differente restent bloquantes.
        case "$candidate" in ''|\#*) continue ;; esac
        candidate_fingerprint="$(printf '%s\n' "$candidate" | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}')"
        if [ "$candidate_fingerprint" = "$SSH_HOST_KEY_SHA256" ]; then
          printf '%s\n' "$candidate" >> ~/.ssh/known_hosts
        fi
      done < ~/.ssh/known_hosts.candidate
      rm -f ~/.ssh/known_hosts.candidate
      test -s ~/.ssh/known_hosts || {
        echo "SSH host key does not match SSH_HOST_KEY_SHA256" >&2
        exit 1
      }
      chmod 644 ~/.ssh/known_hosts
  script:
    - |
      set -e
      : "${DEPLOY_BRANCH:?Missing DEPLOY_BRANCH}"
      : "${DEPLOY_ENV:?Missing DEPLOY_ENV}"
      : "${DEPLOY_ENV_FILE:?Missing DEPLOY_ENV_FILE}"
      : "${DEPLOY_COMPOSE_PROJECT_NAME:?Missing DEPLOY_COMPOSE_PROJECT_NAME}"
      : "${DEPLOY_BACKEND_PORT:?Missing DEPLOY_BACKEND_PORT}"
      : "${DEPLOY_BROWSER_COLLECTOR_SCALE:?Missing DEPLOY_BROWSER_COLLECTOR_SCALE}"

      case "$DEPLOY_ENV" in
        prod)
          DEPLOY_PATH="${FILFINANCE_PROD_DEPLOY_PATH:-/srv/filfinance}"
          DEPLOY_PWA_URL="${FILFINANCE_PROD_PWA_URL:?Missing FILFINANCE_PROD_PWA_URL}"
          test "$DEPLOY_PWA_URL" = "https://app.filfinance.fr" || {
            echo "FILFINANCE_PROD_PWA_URL must equal https://app.filfinance.fr" >&2
            exit 1
          }
          ;;
        dev)
          DEPLOY_PATH="${FILFINANCE_DEV_DEPLOY_PATH:-/raid/app/filfinance/filfinance-dev}"
          DEPLOY_PWA_URL="${FILFINANCE_DEV_PWA_URL:?Missing FILFINANCE_DEV_PWA_URL}"
          printf '%s' "$DEPLOY_PWA_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?$' || {
            echo "FILFINANCE_DEV_PWA_URL must be an HTTPS origin without a path" >&2
            exit 1
          }
          printf '%s' "$DEPLOY_PWA_URL" | grep -Eiq 'replace-with|(^|\.)example\.|\.invalid$' && {
            echo "FILFINANCE_DEV_PWA_URL contains a placeholder host" >&2
            exit 1
          } || true
          ;;
        *) echo "Unsupported DEPLOY_ENV: $DEPLOY_ENV" >&2; exit 1 ;;
      esac

      ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$USER@$HOST" -p "$SSH_PORT" \
      "set -e;
      echo 'Deploying Fil Finance backend';
      echo 'Environment: $DEPLOY_ENV';
      echo 'Branch: $DEPLOY_BRANCH';
      echo 'Commit: $CI_COMMIT_SHA';
      echo 'Deploy path: $DEPLOY_PATH';
      cd '$DEPLOY_PATH';
      if [ -n \"\$(git status --porcelain)\" ]; then
        echo 'Remote deploy worktree is not clean';
        git status --short;
        exit 1;
      fi;
      git fetch origin '$DEPLOY_BRANCH';
      git cat-file -e '$CI_COMMIT_SHA^{commit}';
      git checkout --detach '$CI_COMMIT_SHA';
      test \"\$(git rev-parse HEAD)\" = '$CI_COMMIT_SHA';
      export DOCKER_BUILDKIT=1 COMPOSE_BAKE=true;
      export COMPOSE_PROJECT_NAME='$DEPLOY_COMPOSE_PROJECT_NAME';
      export FILFINANCE_ENV_FILE='$DEPLOY_ENV_FILE';
      export FILFINANCE_BACKEND_PORT='$DEPLOY_BACKEND_PORT';
      export FILFINANCE_BROWSER_COLLECTOR_SCALE='$DEPLOY_BROWSER_COLLECTOR_SCALE';
      if [ ! -f '$DEPLOY_ENV_FILE' ]; then
        echo 'Missing $DEPLOY_ENV_FILE in deploy directory';
        echo 'Create it from .env.server.example on the server before rerunning the pipeline.';
        echo 'Current remote directory:';
        pwd;
        echo 'Directory content:';
        ls -la;
        exit 1;
      fi;
      echo 'Migrating server environment if needed';
      bash scripts/migrate_server_env.sh '$DEPLOY_ENV_FILE';
      echo 'Checking deploy environment isolation';
      bash scripts/check_deploy_env.sh '$DEPLOY_ENV_FILE' '$DEPLOY_ENV';
      echo 'Checking Better Auth environment';
      bash scripts/check_better_auth_env.sh '$DEPLOY_ENV_FILE' '$DEPLOY_ENV' '$DEPLOY_PWA_URL';
      case '$DEPLOY_ENV' in
        prod)
          export FILFINANCE_COMPOSE_FILES=compose.yaml:compose.prod.yaml:compose.ovh.yaml;
          export FILFINANCE_OVH_COMPOSE_FILE='-f compose.ovh.yaml';
          ;;
        dev)
          export FILFINANCE_COMPOSE_FILES=compose.yaml:compose.prod.yaml;
          export FILFINANCE_OVH_COMPOSE_FILE='';
          ;;
      esac;
      echo \"Using compose files: \$FILFINANCE_COMPOSE_FILES\";
      if [ \"\$FILFINANCE_BROWSER_COLLECTOR_SCALE\" = '0' ]; then
        export FILFINANCE_COMPOSE_SCALE_ARGS='--scale financialjuice-browser-collector=0';
      else
        export FILFINANCE_COMPOSE_SCALE_ARGS='';
      fi;
      echo \"Browser collector scale: \$FILFINANCE_BROWSER_COLLECTOR_SCALE\";
      echo 'Validating docker compose configuration';
      docker compose --env-file '$DEPLOY_ENV_FILE' -f compose.yaml -f compose.prod.yaml \$FILFINANCE_OVH_COMPOSE_FILE config >/dev/null;
      # n8n ne fait plus partie du chemin calendrier. L'inventaire reste
      # redige (metadonnees Docker seulement) et cible uniquement le projet
      # Compose de cet environnement ; aucun volume n'est monte ou supprime.
      legacy_n8n_ids=\$(docker ps -aq --filter 'label=com.docker.compose.project=$DEPLOY_COMPOSE_PROJECT_NAME' --filter 'label=com.docker.compose.service=n8n');
      legacy_n8n_postgres_ids=\$(docker ps -aq --filter 'label=com.docker.compose.project=$DEPLOY_COMPOSE_PROJECT_NAME' --filter 'label=com.docker.compose.service=n8n-postgres');
      echo 'Legacy n8n inventory (redacted):';
      for legacy_n8n_id in \$legacy_n8n_ids \$legacy_n8n_postgres_ids; do
        docker ps -a --filter id=\$legacy_n8n_id --format 'id={{.ID}} name={{.Names}} status={{.Status}}';
        docker inspect --format '{{range .Mounts}}{{if .Name}}volume={{.Name}} destination={{.Destination}}{{end}}{{end}}' \$legacy_n8n_id;
      done;
      echo 'Removing legacy n8n containers without deleting their volumes';
      for legacy_n8n_id in \$legacy_n8n_ids \$legacy_n8n_postgres_ids; do
        docker rm -f \$legacy_n8n_id;
      done;
      test -z \"\$(docker ps -aq --filter 'label=com.docker.compose.project=$DEPLOY_COMPOSE_PROJECT_NAME' --filter 'label=com.docker.compose.service=n8n')\";
      test -z \"\$(docker ps -aq --filter 'label=com.docker.compose.project=$DEPLOY_COMPOSE_PROJECT_NAME' --filter 'label=com.docker.compose.service=n8n-postgres')\";
      echo 'Starting backend containers';
      docker compose --env-file '$DEPLOY_ENV_FILE' -f compose.yaml -f compose.prod.yaml \$FILFINANCE_OVH_COMPOSE_FILE up -d --build --force-recreate \$FILFINANCE_COMPOSE_SCALE_ARGS;
      docker compose --env-file '$DEPLOY_ENV_FILE' -f compose.yaml -f compose.prod.yaml \$FILFINANCE_OVH_COMPOSE_FILE ps;
      FILFINANCE_ENV_FILE='$DEPLOY_ENV_FILE' FILFINANCE_CONTAINER_BASE_URL='http://127.0.0.1:8088' bash scripts/smoke_backend_runtime.sh;
      curl -fsS 'http://127.0.0.1:$DEPLOY_BACKEND_PORT/health' >/dev/null;
      exit"

      if [ "${DEPLOY_ENV:-}" = "dev" ] && [ "${FILFINANCE_DEV_BOOTSTRAP_RELEASE:-false}" = "true" ]; then
        # The first DEV deployment creates the Traefik route before the new
        # DNS names and certificates exist. Local server checks still run;
        # only public probes are deferred to the normal release.
        echo 'DEV bootstrap release: skipping public API and HLS probes'
      elif [ -n "${DEPLOY_PUBLIC_API_URL:-}" ]; then
        echo "Checking public backend health: ${DEPLOY_PUBLIC_API_URL}/health"
        curl -fsS "${DEPLOY_PUBLIC_API_URL}/health" >/dev/null
        echo "Checking public Better Auth JWKS: ${DEPLOY_PUBLIC_API_URL}/api/auth/jwks"
        curl -fsS "${DEPLOY_PUBLIC_API_URL}/api/auth/jwks" | grep -q '"keys"'
        if [ -n "${DEPLOY_PUBLIC_HLS_PROBE_URL:-}" ]; then
          echo "Checking public HLS origin through CDN: ${DEPLOY_PUBLIC_HLS_PROBE_URL}"
          hls_status="$(curl -sS -o /tmp/filfinance-hls-probe.txt -w '%{http_code}' "${DEPLOY_PUBLIC_HLS_PROBE_URL}" || true)"
          case "$hls_status" in
            200|401) ;;
            *)
              echo "Unexpected HLS probe status: ${hls_status}" >&2
              cat /tmp/filfinance-hls-probe.txt >&2 || true
              exit 1
              ;;
          esac
        fi
      fi

deploy:main:backend:
  <<: *deploy_backend_template
  resource_group: production
  variables:
    DEPLOY_BRANCH: "main"
    DEPLOY_ENV: "prod"
    DEPLOY_ENV_FILE: ".env.server.prod"
    DEPLOY_COMPOSE_PROJECT_NAME: "filfinance_prod"
    DEPLOY_BACKEND_PORT: "8088"
    DEPLOY_BROWSER_COLLECTOR_SCALE: "1"
    DEPLOY_PUBLIC_API_URL: "https://api.filfinance.fr"
    DEPLOY_PUBLIC_HLS_PROBE_URL: "https://media.filfinance.fr/audio/replay/today/playlist.m3u8"
  environment:
    name: production/backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $FILFINANCE_PROD_RELEASE_REQUESTED == "true" && $FILFINANCE_PROD_DEPLOY_ENABLED == "true" && $FILFINANCE_BETTER_AUTH_DEPLOY_ENABLED == "true"'
      # `--force-recreate` rend ce job sensible au live : aucune execution implicite n'est admissible.
      when: manual
      allow_failure: false

deploy:dev:backend:
  <<: *deploy_backend_template
  resource_group: development
  variables:
    DEPLOY_BRANCH: "dev"
    DEPLOY_ENV: "dev"
    DEPLOY_ENV_FILE: ".env.server.dev"
    DEPLOY_COMPOSE_PROJECT_NAME: "filfinance_dev"
    DEPLOY_BACKEND_PORT: "18088"
    DEPLOY_BROWSER_COLLECTOR_SCALE: "0"
    DEPLOY_PUBLIC_API_URL: "https://api.dev.filfinance.fr"
    DEPLOY_PUBLIC_HLS_PROBE_URL: "https://media.dev.filfinance.fr/audio/replay/today/playlist.m3u8"
  environment:
    name: development/backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $FILFINANCE_DEV_EXECUTION_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $FILFINANCE_DEV_BUNNY_DEPLOY_ENABLED == "true" && $FILFINANCE_BETTER_AUTH_DEPLOY_ENABLED == "true"'
      # Le backend DEV demeure l'unique porte manuelle de la release complete.
      when: manual
      allow_failure: false

smoke:main:frontends:
  stage: smoke
  image: node:24.13.1-alpine
  interruptible: false
  resource_group: production
  needs:
    - job: deploy:main:bunny-landing
