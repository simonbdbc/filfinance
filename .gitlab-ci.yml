    url: https://filfinance.fr
  script:
    - apk add --no-cache bash curl grep
    - |
      FILFINANCE_FRONTEND_URL="https://filfinance.fr" \
      FILFINANCE_PWA_URL="https://app.filfinance.fr" \
        bash scripts/smoke_deploy.sh frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $FILFINANCE_PROD_RELEASE_REQUESTED == "true" && $FILFINANCE_PROD_DEPLOY_ENABLED == "true" && $FILFINANCE_PROD_BUNNY_DEPLOY_ENABLED == "true" && $FILFINANCE_BETTER_AUTH_DEPLOY_ENABLED == "true"'
      # A executer apres activation des certificats Bunny et bascule DNS.
      when: manual
      allow_failure: false

smoke:main:
