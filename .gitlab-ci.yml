default:
  tags:
    - home-runner-docker
  interruptible: true

stages:
  - validate
  - deploy
  - smoke

workflow:
  rules:
    # Les validations et les releases ne s'executent que sur les branches
    # durables. Les branches de correctif et les tags restent des references
    # Git, sans consommer de runner ni creer de pipeline CI.
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
    - when: never

variables:
  # Coordonnées publiques du socle légal ; les valeurs GitLab peuvent les surcharger.
  PUBLIC_LEGAL_ENTITY_NAME: "SB ALGO"
  PUBLIC_LEGAL_REGISTERED_OFFICE: "60 rue François 1er, 75008 Paris"
  PUBLIC_LEGAL_PUBLICATION_DIRECTOR: "sbdev"
  PUBLIC_LEGAL_PRIVACY_CONTACT: "support@filfinance.fr"
  PUBLIC_LEGAL_DATA_RETENTION: "Les données du compte et des préférences sont conservées tant que le compte existe. Pour demander leur suppression, contactez support@filfinance.fr. La demande est examinée en tenant compte des obligations légales et des données nécessaires à la défense de droits ; aucun délai automatique de suppression n’est annoncé."
  FILFINANCE_PROD_HLS_BASE_URL: "https://media.filfinance.fr"
  FILFINANCE_DEV_LANDING_URL: "https://dev.filfinance.fr"
  FILFINANCE_DEV_PWA_URL: "https://app.dev.filfinance.fr"
  FILFINANCE_DEV_API_URL: "https://api.dev.filfinance.fr"
  FILFINANCE_DEV_HLS_BASE_URL: "https://media.dev.filfinance.fr"
  FILFINANCE_DEV_EDGE_URL: "https://live.dev.filfinance.fr"
  FILFINANCE_DEV_ORIGIN_URL: "https://origin.dev.filfinance.fr"
  CARGO_TERM_COLOR: "always"
  CARGO_HOME: "/cargo"
  RUSTUP_HOME: "/rustup"
  CARGO_TARGET_DIR: "/target/filfinance-service"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  WRANGLER_VERSION: "4.121.0"
  # Le pilote Bunny DEV reste protege et explicite, mais n'utilise plus Cloudflare Pages/Workers.
  FILFINANCE_DEV_EXECUTION_ENABLED: "true"

