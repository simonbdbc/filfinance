  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $FILFINANCE_PROD_RELEASE_REQUESTED == "true" && $FILFINANCE_PROD_DEPLOY_ENABLED == "true" && $FILFINANCE_PROD_BUNNY_DEPLOY_ENABLED == "true" && $FILFINANCE_BETTER_AUTH_DEPLOY_ENABLED == "true"'

calendar:main:run-once:
  stage: smoke
  image: node:24.13.1-alpine
  interruptible: false
  resource_group: production
  retry: 0
  timeout: 3 minutes
  needs:
    - job: smoke:main
      artifacts: false
  environment:
    name: production/smoke
    action: verify
  script:
    - node scripts/run_native_calendar_prod_once.mjs
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $FILFINANCE_PROD_RELEASE_REQUESTED == "true" && $FILFINANCE_PROD_DEPLOY_ENABLED == "true" && $FILFINANCE_PROD_BUNNY_DEPLOY_ENABLED == "true" && $FILFINANCE_BETTER_AUTH_DEPLOY_ENABLED == "true" && $FILFINANCE_CALENDAR_RUN_AUTHORIZED == "true" && $FILFINANCE_CALENDAR_RUN_DAY && $FILFINANCE_CALENDAR_RUN_EXPECTED_ID'
      when: manual
      allow_failure: false

smoke:dev:
  stage: smoke
  image: node:24.13.1-alpine
  interruptible: false
  resource_group: development
  needs:
    - job: deploy:dev:landing
      artifacts: false
    - job: deploy:dev:pwa
      artifacts: false
    - job: deploy:dev:backend
      artifacts: false
  environment:
    name: development/smoke
    url: https://dev.filfinance.fr
  script:
    - apk add --no-cache bash curl grep
    - 'test -n "${FILFINANCE_DEV_PWA_URL:-}" || { echo "Missing FILFINANCE_DEV_PWA_URL" >&2; exit 1; }'
    - |
      FILFINANCE_FRONTEND_URL="$FILFINANCE_DEV_LANDING_URL" \
      FILFINANCE_PWA_URL="$FILFINANCE_DEV_PWA_URL" \
      FILFINANCE_API_URL="$FILFINANCE_DEV_API_URL" \
      FILFINANCE_EDGE_URL="$FILFINANCE_DEV_EDGE_URL" \
      FILFINANCE_HLS_URL="$FILFINANCE_DEV_HLS_BASE_URL" \
      FILFINANCE_BUNNY_DEV_SMOKE=1 \
      FILFINANCE_CHECK_EDGE="${FILFINANCE_CHECK_EDGE:-1}" \
        bash scripts/run_deployed_smoke_suite.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $FILFINANCE_DEV_EXECUTION_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $FILFINANCE_DEV_BUNNY_DEPLOY_ENABLED == "true" && $FILFINANCE_BETTER_AUTH_DEPLOY_ENABLED == "true"'
