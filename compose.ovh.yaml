# OVH production overlay.
#
# compose.prod.yaml remains shared with the existing development deployment.
# This overlay removes the legacy Docker-provider exposure from Better Auth and
# Rust on the OVH VPS: Traefik may reach only filfinance-gateway through its
# dedicated external network and its file provider.
services:
  filfinance-auth:
    networks: !override
      - filfinance_internal
    labels: !override []

  filfinance-service:
    networks: !override
      - filfinance_internal
    labels: !override []
