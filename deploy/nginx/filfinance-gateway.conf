map $http_upgrade $filfinance_connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $filfinance_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

upstream filfinance_auth_upstream {
  server filfinance-auth:3000;
  keepalive 16;
}

upstream filfinance_service_upstream {
  server filfinance-service:8088;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;

  client_max_body_size 10m;

  location ~ ^/(?:api/auth(?:/|$)|api/me$) {
    proxy_pass http://filfinance_auth_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $filfinance_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $filfinance_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://filfinance_service_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $filfinance_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $filfinance_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
