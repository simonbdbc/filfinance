services:
  traefik:
    # Keep this pinned to the current v3 minor release family; update after
    # reviewing Traefik release notes and testing the configuration.
    image: traefik:v3.7.7
    container_name: filfinance_traefik
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    networks:
      - traefik_network
    tmpfs:
      - /tmp:mode=1777
    environment:
      TRAEFIK_ACME_EMAIL: ${TRAEFIK_ACME_EMAIL:?Set TRAEFIK_ACME_EMAIL in .env}
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --api.dashboard=false
      - --api.insecure=false
      - --log.level=INFO
      - --accesslog=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.lets_encrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.lets_encrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.lets_encrypt.acme.httpchallenge.entrypoint=web
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      # Create this regular file with chmod 600 before starting Traefik.
      - ./acme.json:/acme/acme.json

networks:
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-traefik_network}
