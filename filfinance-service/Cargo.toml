[package]
name = "filfinance-service"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
dotenvy = "0.15"
futures-util = "0.3"
hmac = "0.12"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
ordered-local-logger = { path = "vendor/ordered-local-logger" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
quick-xml = "0.39"
percent-encoding = "2"
regex = "1"
# FinancialJuice bloque le client Rustls en amont; `native-tls` rapproche l'empreinte TLS du systeme local.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "gzip", "brotli", "cookies", "http2"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `sqlx` garde Rustls pour conserver un runtime DB independant du client HTTP externe.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "derive"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
